services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lifecycle
      POSTGRES_USER: lifecycle
      POSTGRES_PASSWORD: lifecycle
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000","9001:9001"]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025","8025:8025"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://lifecycle:lifecycle@postgres:5432/lifecycle
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecret
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  celery_worker:
    build: ./backend
    command: celery -A app.jobs.celery_app.celery worker -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://lifecycle:lifecycle@postgres:5432/lifecycle
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecret
    depends_on: [backend, redis]
  celery_beat:
    build: ./backend
    command: celery -A app.jobs.celery_app.celery beat -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://lifecycle:lifecycle@postgres:5432/lifecycle
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecret
    depends_on: [backend, redis]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
